name: Validate shared dispatch action coverage

on:
  push:
    branches: [validation/rea-dispatch-coverage-20261117]

permissions:
  contents: read

concurrency:
  group: validate-dispatch-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Prepare isolated exact source and producer
        run: |
          echo "REA_SOURCE_ROOT=$RUNNER_TEMP/rea-dispatch-source" >> "$GITHUB_ENV"
          echo "REA_VALIDATION_OUTPUT=$RUNNER_TEMP/rea-dispatch-results" >> "$GITHUB_ENV"
          echo "REA_NPM_CLI=$RUNNER_TEMP/rea-dispatch-toolchain/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/rea-dispatch-source" af062e7a2d290fec4307fb9444298a13c2fea630
          npm install --prefix "$RUNNER_TEMP/rea-dispatch-toolchain" --no-audit --no-fund npm@11.16.0
          echo "$RUNNER_TEMP/rea-dispatch-toolchain/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install locked source dependencies
        working-directory: ${{ runner.temp }}/rea-dispatch-source
        run: node "$REA_NPM_CLI" ci --no-audit --no-fund
      - name: Verify public dispatch coverage before and after
        run: python3 contribution-validation/native-dispatch-coverage/measure.py
      - name: Retain exact inputs, outputs and native logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-dispatch-coverage-validation
          path: ${{ runner.temp }}/rea-dispatch-results/
          retention-days: 7
